name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      # Pings public.projects, the only table anon can read once RLS is enabled.
      # SUPABASE_KEY here must stay the ANON key: this repo and its Actions logs
      # are public, so the service_role key must never be used from Actions.
      - name: Send a request to Supabase
        run: |
          curl -f -s -o /dev/null -w "%{http_code}\n" \
          "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
